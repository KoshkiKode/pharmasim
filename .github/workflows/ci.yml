name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Typecheck, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # Builds the engine first (the apps import its compiled output), then
      # type-checks engine, React Native mobile, and the Linux desktop client.
      # DesktopNative is excluded: it has no typecheck script and is covered
      # by the separate Jest step below.
      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Desktop native test
        working-directory: apps/DesktopNative
        run: npm test

      - name: Build engine
        run: npm run build

      - name: Build desktop web bundle
        run: npm run build -w apps/linux-desktop
