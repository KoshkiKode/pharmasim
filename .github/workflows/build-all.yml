name: Build Cross-Platform Binaries

on:
  push:
    branches:
      - main
  release:
    types: [created]

jobs:
  # 1. Android
  android-build:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Install Android NDK
        run: sdkmanager "ndk;27.1.12297006"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # apps/mobile imports @pharmasim/engine's compiled dist/, which is
      # git-ignored and must be built before any app that depends on it.
      - name: Build shared engine
        run: npm run build

      - name: Build debug APK
        run: ./gradlew assembleDebug
        working-directory: ./apps/mobile/native/android

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: PharmaSim-Android-debug
          path: apps/mobile/native/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # 2. iOS simulator build; distribution builds require signing credentials.
  ios-build:
    name: Build iOS simulator app
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # apps/mobile imports @pharmasim/engine's compiled dist/, which is
      # git-ignored and must be built before any app that depends on it.
      - name: Build shared engine
        run: npm run build

      - name: Install CocoaPods
        run: pod install
        working-directory: ./apps/mobile/native/ios

      - name: Build iOS simulator app
        run: xcodebuild -workspace PharmaSimMobile.xcworkspace -scheme PharmaSimMobile -sdk iphonesimulator -configuration Debug -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
        working-directory: ./apps/mobile/native/ios

      - name: Upload iOS simulator app
        uses: actions/upload-artifact@v5
        with:
          name: PharmaSim-iOS-simulator
          path: apps/mobile/native/ios/build/Build/Products/Debug-iphonesimulator/PharmaSimMobile.app
          if-no-files-found: error

  # 3. macOS Native App
  macos-build:
    name: Build macOS DMG
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # apps/DesktopNative imports @pharmasim/engine's compiled dist/, which
      # is git-ignored and must be built before any app that depends on it.
      - name: Build shared engine
        run: npm run build

      - name: Install Pods
        run: cd macos && pod install
        working-directory: ./apps/DesktopNative

      - name: Verify macOS workspace
        run: |
          test -d DesktopNative.xcworkspace
          test -f DesktopNative.xcworkspace/contents.xcworkspacedata
          xcodebuild -list -workspace DesktopNative.xcworkspace
        working-directory: ./apps/DesktopNative/macos

      - name: Build and Package macOS App
        run: ./build-macos.sh
        working-directory: ./apps/DesktopNative

      - name: Upload Artifact
        uses: actions/upload-artifact@v5
        with:
          name: macOS-DMG
          path: apps/DesktopNative/macos/dist/*.dmg

  # 4. Windows desktop app
  windows-build:
    name: Build Windows Tauri installers
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # apps/linux-desktop imports @pharmasim/engine's compiled dist/, which
      # is git-ignored and must be built before Tauri bundles the frontend.
      - name: Build shared engine
        run: npm run build

      - name: Preflight Windows build tooling
        run: |
          cargo --version
          rustc --version
          npm run tauri --workspace apps/linux-desktop -- --version
          if (!(Test-Path apps/linux-desktop/src-tauri/tauri.conf.json)) { throw "Tauri configuration is missing" }
        shell: pwsh

      - name: Build Windows installers
        run: npm run tauri:build -w apps/linux-desktop

      - name: Upload Artifact
        uses: actions/upload-artifact@v5
        with:
          name: Windows-Tauri-installers
          path: |
            apps/linux-desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/linux-desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  # 5. Linux Tauri App
  linux-build:
    name: Build Linux Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install WebKit and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
              build-essential \
              curl \
              wget \
              file \
              libssl-dev \
              libgtk-3-dev \
              libayatana-appindicator3-dev \
              librsvg2-dev

      - name: Install JS dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Linux Binaries (deb & AppImage)
        run: ./build-linux.sh

      - name: Upload Debian Package
        uses: actions/upload-artifact@v5
        with:
          name: Linux-DEB
          path: apps/linux-desktop/src-tauri/target/release/bundle/deb/*.deb

      - name: Upload AppImage
        uses: actions/upload-artifact@v5
        with:
          name: Linux-AppImage
          path: apps/linux-desktop/src-tauri/target/release/bundle/appimage/*.AppImage
