// npm workspaces can nest the React Native Gradle plugin under
// react-native/node_modules instead of hoisting it to the repo root, so ask Node
// where it really is rather than hardcoding node_modules/@react-native/gradle-plugin.
// (includeBuild gets the absolute path as a String: passing a File object here is
// not picked up for plugin resolution.)
pluginManagement {
    def reactNativeGradlePlugin = new File(
        providers.exec {
            workingDir(rootDir)
            commandLine("node", "--print", "require.resolve('@react-native/gradle-plugin/package.json', { paths: [require.resolve('react-native/package.json')] })")
        }.standardOutput.asText.get().trim()
    ).parentFile.absolutePath
    includeBuild(reactNativeGradlePlugin)
}
plugins { id("com.facebook.react.settings") }
extensions.configure(com.facebook.react.ReactSettingsExtension){ ex -> ex.autolinkLibrariesFromCommand() }
rootProject.name = 'com.koshkikode.pharmasim'
include ':app'
// Same resolution as in pluginManagement above (variables there are not visible here).
includeBuild(new File(
    providers.exec {
        workingDir(rootDir)
        commandLine("node", "--print", "require.resolve('@react-native/gradle-plugin/package.json', { paths: [require.resolve('react-native/package.json')] })")
    }.standardOutput.asText.get().trim()
).parentFile.absolutePath)
